<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<title>어두운 역</title>
<link rel="manifest" href="../v2/manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="stage"><canvas id="cv" width="240" height="160"></canvas><div id="goal" hidden></div><div id="toast" hidden></div></div>
  <div id="dlg" hidden></div>
  <div id="fade" hidden></div>
  <div id="pad">
    <div class="dpad">
      <button type="button" data-dir="up" aria-label="위">▲</button>
      <button type="button" data-dir="left" aria-label="왼쪽">◀</button>
      <button type="button" data-dir="right" aria-label="오른쪽">▶</button>
      <button type="button" data-dir="down" aria-label="아래">▼</button>
    </div>
    <div class="ab">
      <button type="button" id="btnB" aria-label="메뉴">메뉴</button>
      <button type="button" id="btnA" aria-label="조사">조사</button>
    </div>
  </div>
</div>
<script src="../v2/data.js?v=13"></script>
<script src="../v2/engine.js?v=13"></script>
<script src="art3.js?v=13"></script>
<script src="maps.js?v=13"></script>
<script src="ui.js?v=13"></script>
<script src="fx.js?v=13"></script>
<script src="battle.js?v=13"></script>
<script src="game.js?v=13"></script>
</body>
</html>
