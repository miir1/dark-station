<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0a09">
<title>어두운 역 v4</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<!-- PC 가로 틀: 논리 640×360 을 정수 배율로 키운다 (720p = 2배, 1080p = 3배). 지도 480×320 + 띠 40, 오른쪽 패널 160 -->
<div id="viewport">
  <div id="app">
    <div id="main">
      <div id="stage">
        <canvas id="cv" width="480" height="320"></canvas>
        <div id="cg" hidden></div>
        <div id="box" hidden></div>
        <div id="toast" hidden></div>
      </div>
      <div id="strip"><span id="goal"></span><span id="hint"></span></div>
    </div>
    <aside id="panel">
      <div id="hud"></div>
      <div id="tabs">
        <button type="button" id="tabTreat" title="H">치료</button>
        <button type="button" id="tabBook" title="Tab">수첩</button>
        <button type="button" id="tabPause" title="Esc">메뉴</button>
        <button type="button" id="tabFull" title="F">전체화면</button>
      </div>
      <div id="keys">이동 WASD·방향키 · 조사 Space · 취소 Esc · 수첩 Tab · 치료 H · 달리기 Shift · 선택 1~9</div>
    </aside>
    <div id="fade" hidden></div>
  </div>
</div>
<script src="engine/rng.js"></script>
<script src="engine/cond.js"></script>
<script src="engine/schema.js"></script>
<script src="engine/tables.js"></script>
<script src="engine/identity.js"></script>
<script src="engine/effects.js"></script>
<script src="engine/night.js"></script>
<script src="engine/ledger.js"></script>
<script src="engine/engine.js"></script>
<script src="engine/save.js"></script>
<script src="engine/browser.js?v=3"></script>
<script src="art.js?v=5"></script>
<script src="ui.js?v=6"></script>
<script src="render.js?v=5"></script>
<script src="game.js?v=8"></script>
</body>
</html>
