<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<title>어두운 역</title>
<link rel="manifest" href="../v2/manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<!-- 설계 v7: PC 가로 틀. 논리 640×360을 정수 배율로 키운다 (720p = 2배, 1080p = 3배) -->
<div id="viewport">
  <div id="app">
    <div id="main">
      <div id="stage"><canvas id="cv" width="480" height="320"></canvas><div id="toast" hidden></div></div>
      <div id="strip"><span id="goal"></span><span id="hint"></span></div>
      <div id="dlg" hidden></div>
    </div>
    <aside id="panel">
      <div id="hud"></div>
      <div id="tabs">
        <button type="button" id="tabBook" title="Tab">수첩</button>
        <button type="button" id="tabPause" title="Esc">메뉴</button>
        <button type="button" id="tabFull" title="F">전체화면</button>
      </div>
      <div id="keys">이동 WASD·방향키 · 조사 Space · 취소 Esc · 수첩 Tab · 달리기 Shift</div>
    </aside>
    <div id="fade" hidden></div>
  </div>
</div>
<script src="../v2/data.js?v=25"></script>
<script src="../v2/engine.js?v=25"></script>
<script src="art3.js?v=25"></script>
<script src="maps.js?v=25"></script>
<script src="ui.js?v=25"></script>
<script src="fx.js?v=25"></script>
<script src="battle.js?v=25"></script>
<script src="game.js?v=25"></script>
</body>
</html>
